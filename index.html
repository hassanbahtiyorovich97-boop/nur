<title>Қуръон устози</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Noto+Sans:wght@400;600;800&display=swap">
<style>
/* VOICE: calm, respectful teacher; few hues, fine detail, air
   IDEA: an illuminated mushaf page with a lapis-and-gold border band
   PICTURE: girih star band + the open lesson itself as the working surface
   COLOUR and TYPE: white / deep lapis / turquoise accent, gold hairlines; Noto Sans + Amiri Quran
   LAYOUT: modest header, today's work first, bottom tab bar on phones */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0b1226);--ink:light-dark(#0f172a,#e8ecf7);--mute:light-dark(#55607a,#9aa6c4);
--lapis:light-dark(#1f3a93,#7d9bff);--lapisbg:light-dark(#eef2ff,#141f42);--tq:light-dark(#0b8f8a,#38d1c8);
--gold:light-dark(#b08a2e,#d8b45a);--line:light-dark(#e3e7f1,#243156);--card:light-dark(#ffffff,#101a36);
--ok:light-dark(#137a4a,#4fd18f);--bad:light-dark(#b42318,#ff8a80);--hl:light-dark(#fff1c2,#4a3b10)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans",system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(150px + env(safe-area-inset-bottom));padding-top:env(safe-area-inset-top)}
a{color:var(--lapis)}
.wrap{max-width:980px;margin:0 auto;padding:0 max(4vw,14px)}
header{border-bottom:1px solid var(--line)}
.band svg{display:block;width:100%;height:46px}
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px;padding:18px 0 14px}
h1{font-size:clamp(28px,5vw,40px);line-height:1.05;margin:0;font-weight:800;color:var(--lapis);text-wrap:balance}
.sub{color:var(--mute);font-size:14px;margin-top:4px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;background:var(--card)}
.chip b{color:var(--lapis)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
#pl{position:fixed;left:0;right:0;bottom:calc(57px + env(safe-area-inset-bottom));z-index:6;background:var(--lapis);color:#fff}
#pl .wrap{display:flex;align-items:center;gap:6px;padding-top:6px;padding-bottom:6px;flex-wrap:wrap}
#pl .t{flex:1 1 140px;font-size:14px;line-height:1.3}
#pl button,#pl select{min-height:40px;min-width:40px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font:inherit;font-size:15px;padding:4px 8px}
#pl select option{color:#000}
.now{background:var(--lapisbg);border-radius:10px}
.recdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-inline-end:6px;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
nav .wrap{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding-left:2px;padding-right:2px}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;text-decoration:none;color:var(--mute);font-size:12px;min-height:56px}
nav a svg{width:22px;height:22px}
nav a.on{color:var(--lapis);font-weight:600}
main{padding:20px 0 30px}
h2{font-size:26px;line-height:1.1;margin:4px 0 12px}
h3{font-size:18px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lesson{display:flex;gap:12px;align-items:flex-start;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.num{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--lapisbg);color:var(--lapis);border:1px solid var(--gold)}
.num.done{background:var(--tq);color:#fff;border-color:var(--tq)}
.small{font-size:14px;color:var(--mute)}
.ar{font-family:"Amiri Quran","Amiri",serif;direction:rtl;font-size:calc(30px*var(--arz,1));line-height:2.1;text-align:right}
.ar .w{padding:0 2px;border-radius:6px}
.ar .hl{background:var(--hl);box-shadow:inset 0 -2px 0 var(--gold)}
.letters{font-family:"Amiri Quran",serif;direction:rtl;font-size:34px;letter-spacing:10px;color:var(--lapis);text-align:center;padding:6px 0}
.ex{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.ref{font-size:13px;color:var(--gold);font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;text-decoration:none}
.btn.p{background:var(--lapis);border-color:var(--lapis);color:#fff}
.btn:focus-visible,select:focus-visible,input:focus-visible,.lesson:focus-visible{outline:3px solid var(--tq);outline-offset:2px}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.ok{border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.no{border-color:var(--bad);color:var(--bad)}
select,input[type=file]{font:inherit;font-size:16px;min-height:44px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ayah{border-bottom:1px solid var(--line);padding:10px 0}
.ayah .ar{font-size:calc(28px*var(--arz,1))}
.hide .ar{filter:blur(7px);cursor:pointer}
.hide .ar.show{filter:none}
.mark{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);font-size:13px;color:var(--gold);margin-inline-end:6px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--lapisbg);color:var(--lapis);margin:2px 4px 2px 0;white-space:nowrap}

.fig{position:relative;min-height:220px;margin-top:10px}.fig>canvas{position:absolute;inset:0;width:100%;height:100%}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
.note{border-left:3px solid var(--gold);padding:8px 12px;background:var(--lapisbg);border-radius:0 10px 10px 0;font-size:15px}
.hidden{display:none}
.big{font-family:"Amiri",serif;font-size:calc(80px*var(--arz,1));line-height:1.3;text-align:center;color:var(--lapis)}
.forms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.forms div{border:1px solid var(--line);border-radius:10px;padding:4px}
.forms .g{font-family:"Amiri",serif;font-size:40px;line-height:1.6;direction:rtl}
.syl{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.syl button{font-family:"Amiri",serif;font-size:34px;line-height:1.5;direction:rtl;flex-direction:column;justify-content:center}
.bkws{grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}.bkws .ar{font-size:calc(30px*var(--arz));line-height:1.7;white-space:nowrap}.bkws small{direction:ltr}
.syl small{display:block;font-family:"Noto Sans",sans-serif;font-size:13px;color:var(--mute)}
#pgbox{overflow:auto;padding:0;background:#fff}#pgcv{display:block}
@media(min-width:900px){nav{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line)}#pl{bottom:0}body{padding-bottom:70px}nav a{flex-direction:row;gap:8px;font-size:15px;justify-content:center}}
@media(prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}}}

.top{align-items:center;padding-left:max(4vw,14px)!important;padding-right:max(4vw,14px)!important}#hdr .row{gap:6px}#hdr .btn{min-height:40px;padding:6px 12px}
.w{cursor:pointer;transition:background .15s}.w.kw{background:var(--tq);color:#fff;border-radius:6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.kpi{text-align:center;margin:0}.kv{font-size:22px;font-weight:800;color:var(--lapis)}
.pbar{height:8px;border-radius:99px;background:var(--lapisbg);overflow:hidden;margin:6px 0}.pbar b{display:block;height:100%;background:linear-gradient(90deg,var(--lapis),var(--tq));border-radius:99px}
.prow{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-top:8px}
.plan{display:grid;gap:8px}.btn.lg{min-height:52px;font-size:16px;justify-content:flex-start;text-align:left}
.gift{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,var(--lapisbg),transparent);border-color:var(--gold)}.gift-ic{font-size:34px}
.examc{display:flex;gap:12px;align-items:center;justify-content:space-between;border-color:var(--gold)}
a.lesson{text-decoration:none}
.stage{position:relative}.stg-body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:12px;align-items:center}
.head{width:100%;height:auto;max-height:300px}.head .skin{fill:light-dark(#f4e4d4,#3a3030);stroke:light-dark(#c9ab8f,#6d5a52);stroke-width:2}
.head .cav{fill:light-dark(#fbd5d5,#5a3a40);opacity:.75}.head .tongue{fill:light-dark(#e88f9c,#b0606c);transition:d .3s}.head .tooth{fill:#fff;stroke:#bbb}.head .lip{fill:light-dark(#d9707c,#b55a66);transition:transform .25s}
.head .glow{fill:var(--tq);opacity:0;transition:opacity .3s}.head .pt .ring{fill:none;stroke:var(--gold);stroke-width:2;opacity:0}.head .pt .dot{fill:var(--gold);opacity:.3}
.head .pt.hot .ring{opacity:1;stroke:var(--tq);stroke-width:3}.head .pt.hot .dot{fill:var(--tq);opacity:1}
.stage.on .pt.hot .ring{animation:pulse .7s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.6);opacity:.3}}
.head .stop{opacity:0;transition:opacity .3s}.head .stop polygon{fill:#c62828}.head .stop text{fill:#fff;font:700 15px sans-serif}
.stage.on.k-waqf .stop{opacity:1}
.stage.on.k-ghunna .glow,.stage.on.k-ikhfa .glow,.stage.on.k-iqlab .glow,.stage.on.k-idgham .glow{opacity:.55;animation:gl .5s ease-in-out infinite alternate}@keyframes gl{to{opacity:.2}}
.stage.on.k-iqlab #lipU,.stage.on.k-shafawi #lipU{transform:translateY(4px)}.stage.on.k-iqlab #lipL,.stage.on.k-shafawi #lipL{transform:translateY(-4px)}
.stage.on.k-tafkhim #tongue{transform:translate(4px,-7px) rotate(-3deg);transform-box:fill-box;transform-origin:center}
.stage.on.k-qalqala .pt.hot .dot{animation:bounce .25s ease-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes bounce{to{transform:translateY(-6px)}}
.stg-big{font-size:calc(38px*var(--arz,1));text-align:center;color:var(--lapis);min-height:1.4em;line-height:1.7}
.meter{position:relative;height:18px;border-radius:9px;background:var(--lapisbg);overflow:hidden;margin-top:10px;border:1px solid var(--line)}.meter b{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--gold),var(--tq))}.meter i{position:absolute;top:0;bottom:0;width:2px;background:var(--card)}
.mkwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:12px;align-items:start}.mkwrap .stage{position:sticky;top:70px}
button.mk{display:grid;grid-template-columns:76px minmax(0,1fr);gap:4px 12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:8px 4px;color:inherit;font:inherit;cursor:pointer;min-height:56px}
button.mk .ar{font-size:calc(32px*var(--arz,1));line-height:1.4;text-align:center}button.mk.sel{background:var(--lapisbg);border-radius:8px}
.inp{width:100%;font:inherit;font-size:16px;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}.ltr{direction:ltr;font-size:13px}
.segc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.exq .big{font-size:calc(72px*var(--arz,1))}.exq .syl button,.exo.ar{font-family:"Amiri",serif;font-size:calc(34px*var(--arz,1))}
.ob{position:fixed;inset:0;z-index:20;background:rgba(10,18,40,.55);display:grid;place-items:center;padding:16px}
.obc{background:var(--card);color:var(--ink);border-radius:18px;max-width:440px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:92vh;overflow:auto}
.obc h2{margin-top:10px}.obc .opt{width:100%;margin:6px 0}.band-sm{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--lapis),var(--tq),var(--gold))}
.dots{display:flex;gap:6px;justify-content:center;margin-top:14px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--lapis)}
.star{position:absolute;z-index:30;font-size:22px;pointer-events:none;animation:fly .9s ease-out forwards}@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(1.4);opacity:0}}
body.kids .btn{min-height:56px;font-size:18px;border-radius:14px}body.kids h2{font-size:30px}body.kids .card{border-radius:20px}body.kids .small{font-size:15px}
@media(max-width:640px){.mkwrap{grid-template-columns:minmax(0,1fr)}.stg-body{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.stg-big{font-size:calc(28px*var(--arz,1))}.head{max-height:190px}.mkwrap .head{max-height:240px}.mkwrap .stage{position:static}.grid3{gap:6px}.kv{font-size:18px}#hdr h1{font-size:26px}#hdr .sub{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.glg .grid{gap:10px}.glg .glc{margin:0}
.glar{font-size:calc(24px*var(--arz));line-height:1.3;white-space:nowrap;margin-inline-start:8px}
#glSearch{min-height:46px;border:1px solid var(--line);border-radius:12px;padding:8px 14px;font:inherit;background:var(--card);color:inherit}
@media(max-width:420px){nav a{font-size:10.5px;padding-left:0;padding-right:0}}
.shelf{display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit}.shelf .sic{font-size:34px;line-height:1}.shelf .pbar{margin-top:6px}
.prose p{margin:0 0 10px;line-height:1.6}.prose p:last-child{margin:0}
.pt{padding:6px 4px;border-bottom:1px solid var(--line)}.pt:last-child{border:0}.pt b{font-size:18px}.ptn{background:var(--lapisbg);border-radius:8px;color:var(--lapis)}
.ptt{border-collapse:collapse;width:100%;font-size:13.5px;white-space:nowrap}.ptt th,.ptt td{padding:5px 6px;text-align:center;border-bottom:1px solid var(--line)}.ptt th{font-weight:600;color:var(--mute);font-size:12px}.ptt td:first-child{text-align:left;font-weight:600}
.hcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}.hw{text-align:center;font-size:12px;color:var(--mute)}
.hc{display:flex;flex-direction:column;align-items:center;padding:5px 0;border-radius:8px;background:var(--lapisbg)}.hc b{font-size:15px}.hc i{font-style:normal;font-size:11px;color:var(--gold)}
.hc.tod{outline:2px solid var(--lapis)}.hc.ev{background:var(--gold);color:#fff}.hc.ev i{color:#fff}
details.fqi summary{cursor:pointer;list-style:none;padding-right:18px;position:relative}details.fqi summary::after{content:'+';position:absolute;right:0;top:0;color:var(--mute);font-weight:700}details.fqi[open] summary::after{content:'–'}details.fqi p{margin:8px 0;line-height:1.55}
.fqcats .btn{padding:6px 10px;font-size:13px}
</style>
</head>
