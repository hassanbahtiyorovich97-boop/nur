<style>
/* VOICE: calm, respectful teacher; few hues, fine detail, air
   IDEA: an illuminated mushaf page with a lapis-and-gold border band
   PICTURE: girih star band + the open lesson itself as the working surface
   COLOUR and TYPE: white / deep lapis / turquoise accent, gold hairlines; Noto Sans + Amiri Quran
   LAYOUT: modest header, today's work first, bottom tab bar on phones */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0b1226);--ink:light-dark(#0f172a,#e8ecf7);--mute:light-dark(#55607a,#9aa6c4);
--lapis:light-dark(#1f3a93,#7d9bff);--lapisbg:light-dark(#eef2ff,#141f42);--tq:light-dark(#0b8f8a,#38d1c8);
--gold:light-dark(#b08a2e,#d8b45a);--line:light-dark(#e3e7f1,#243156);--card:light-dark(#ffffff,#101a36);
--ok:light-dark(#137a4a,#4fd18f);--bad:light-dark(#b42318,#ff8a80);--hl:light-dark(#fff1c2,#4a3b10)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans",system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(150px + env(safe-area-inset-bottom));padding-top:env(safe-area-inset-top)}
a{color:var(--lapis)}
.wrap{max-width:980px;margin:0 auto;padding:0 max(4vw,14px)}
header{border-bottom:1px solid var(--line)}
.band svg{display:block;width:100%;height:46px}
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px;padding:18px 0 14px}
h1{font-size:clamp(28px,5vw,40px);line-height:1.05;margin:0;font-weight:800;color:var(--lapis);text-wrap:balance}
.sub{color:var(--mute);font-size:14px;margin-top:4px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;white-space:nowrap;background:var(--card)}
.chip b{color:var(--lapis)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
#pl{position:fixed;left:0;right:0;bottom:calc(57px + env(safe-area-inset-bottom));z-index:6;background:var(--lapis);color:#fff}
#pl .wrap{display:flex;align-items:center;gap:6px;padding-top:6px;padding-bottom:6px;flex-wrap:wrap}
#pl .t{flex:1 1 140px;font-size:14px;line-height:1.3}
#pl button,#pl select{min-height:40px;min-width:40px;border-radius:10px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;font:inherit;font-size:15px;padding:4px 8px}
#pl select option{color:#000}
.now{background:var(--lapisbg);border-radius:10px}
.recdot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-inline-end:6px;animation:bl 1s infinite}@keyframes bl{50%{opacity:.2}}
nav .wrap{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding-left:4px;padding-right:4px}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;text-decoration:none;color:var(--mute);font-size:12px;min-height:56px}
nav a svg{width:22px;height:22px}
nav a.on{color:var(--lapis);font-weight:600}
main{padding:20px 0 30px}
h2{font-size:26px;line-height:1.1;margin:4px 0 12px}
h3{font-size:18px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.lesson{display:flex;gap:12px;align-items:flex-start;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.num{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--lapisbg);color:var(--lapis);border:1px solid var(--gold)}
.num.done{background:var(--tq);color:#fff;border-color:var(--tq)}
.small{font-size:14px;color:var(--mute)}
.ar{font-family:"Amiri Quran","Amiri",serif;direction:rtl;font-size:30px;line-height:2.1;text-align:right}
.ar .w{padding:0 2px;border-radius:6px}
.ar .hl{background:var(--hl);box-shadow:inset 0 -2px 0 var(--gold)}
.letters{font-family:"Amiri Quran",serif;direction:rtl;font-size:34px;letter-spacing:10px;color:var(--lapis);text-align:center;padding:6px 0}
.ex{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.ref{font-size:13px;color:var(--gold);font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;cursor:pointer;text-decoration:none}
.btn.p{background:var(--lapis);border-color:var(--lapis);color:#fff}
.btn:focus-visible,select:focus-visible,input:focus-visible,.lesson:focus-visible{outline:3px solid var(--tq);outline-offset:2px}
.opt{display:block;width:100%;text-align:left;margin:6px 0}
.opt.ok{border-color:var(--ok);color:var(--ok);font-weight:600}
.opt.no{border-color:var(--bad);color:var(--bad)}
select,input[type=file]{font:inherit;font-size:16px;min-height:44px;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ayah{border-bottom:1px solid var(--line);padding:10px 0}
.ayah .ar{font-size:28px}
.hide .ar{filter:blur(7px);cursor:pointer}
.hide .ar.show{filter:none}
.mark{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);font-size:13px;color:var(--gold);margin-inline-end:6px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--lapisbg);color:var(--lapis);margin:2px 4px 2px 0;white-space:nowrap}
.mk{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 12px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.mk .ar{font-size:36px;line-height:1.4;text-align:center}
.fig{position:relative;min-height:220px;margin-top:10px}.fig>canvas{position:absolute;inset:0;width:100%;height:100%}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
.note{border-left:3px solid var(--gold);padding:8px 12px;background:var(--lapisbg);border-radius:0 10px 10px 0;font-size:15px}
.hidden{display:none}
.big{font-family:"Amiri",serif;font-size:96px;line-height:1.3;text-align:center;color:var(--lapis)}
.forms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;text-align:center}
.forms div{border:1px solid var(--line);border-radius:10px;padding:4px}
.forms .g{font-family:"Amiri",serif;font-size:40px;line-height:1.6;direction:rtl}
.syl{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.syl button{font-family:"Amiri",serif;font-size:34px;line-height:1.5;direction:rtl}
.syl small{display:block;font-family:"Noto Sans",sans-serif;font-size:13px;color:var(--mute)}
#pgbox{overflow:auto;padding:0;background:#fff}#pgcv{display:block}
@media(min-width:900px){nav{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line)}#pl{bottom:0}body{padding-bottom:70px}nav a{flex-direction:row;gap:8px;font-size:15px;justify-content:center}}
@media(prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(4px)}}}
</style>
</head>
<body>
<header>
  <div class="band" aria-hidden="true"><svg viewBox="0 0 960 46" preserveAspectRatio="xMidYMid slice"><defs><pattern id="g" width="46" height="46" patternUnits="userSpaceOnUse"><rect width="46" height="46" fill="var(--lapis)"/><g fill="none" stroke="var(--gold)" stroke-width="1.4"><path d="M23 5l5 8.5 9.5-1-1 9.5L45 23l-8.5 5 1 9.5-9.5-1L23 45l-5-8.5-9.5 1 1-9.5L1 23l8.5-5-1-9.5 9.5 1z"/><circle cx="23" cy="23" r="6" stroke="var(--tq)"/></g></pattern></defs><rect width="960" height="46" fill="url(#g)"/></svg></div>
  <div class="wrap top">
    <div><h1>Қуръон устози</h1><div class="sub">Тажвид дарслари, буюк қорилар овози ва ўқишингизни текшириш</div></div>
    <div class="stats" id="stats"></div>
  </div>
</header>
<nav><div class="wrap" id="nav"></div></nav>
<main class="wrap" id="view"><p class="small">Юкланмоқда…</p></main>
<div id="pl" class="hidden" role="region" aria-label="Аудио"><div class="wrap">
<div class="t" id="plt"></div>
<button id="pprev" aria-label="Олдинги оят">⏮</button><button id="pplay" aria-label="Ўйнатиш ёки тўхтатиш">⏸</button><button id="pnext" aria-label="Кейинги оят">⏭</button>
<select id="prep" aria-label="Такрор"><option value="1">×1</option><option value="3">×3</option><option value="5">×5</option><option value="10">×10</option></select>
<select id="prate" aria-label="Тезлик"><option value="0.75">0.75x</option><option value="1">1x</option></select>
<button id="pclose" aria-label="Ёпиш">✕</button></div></div>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem('qu_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('qu_'+k,JSON.stringify(v))}catch(e){}}};
let Q=null;
const pad=n=>String(n).padStart(3,'0');

const R=[
{id:'husary-m',n:'Маҳмуд Халил ал-Ҳусорий (муаллим)',c:'Миср',f:'Husary_Muallim_128kbps',sp:'секин',why:'Муаллим мусҳаф: ҳар ҳарф аниқ, мадлар ўлчови бир хил. Асосий эталон.',use:'Махраж, мад ҳаракат сони, ғунна, қалқала'},
{id:'husary',n:'ал-Ҳусорий (муратталь)',c:'Миср',f:'Husary_128kbps',sp:'ўртача',why:'Ўша устознинг оддий тезликдаги ўқиши.',use:'Муаллим ёзувидан кейинги қадам'},
{id:'minshawi',n:'Муҳаммад Сиддиқ ал-Миншовий',c:'Миср',f:'Minshawy_Murattal_128kbps',sp:'секин',why:'Ниҳоятда аниқ ва таъсирли муратталь.',use:'Ғунна, ихфо, идғомни Ҳусорий билан солиштириш'},
{id:'banna',n:'Маҳмуд Али ал-Банно',c:'Миср',f:'mahmoud_ali_al_banna_32kbps',sp:'ўртача',why:'Қоидага жуда содиқ, тиниқ муратталь.',use:'Иккинчи эталон: мад, ғунна, вақф'},
{id:'maasarawi',n:'Аҳмад Исо ал-Маъсаровий',c:'Миср',f:'',q:'أحمد عيسى المعصراوي تجويد',sp:'ўртача',why:'Миср қорилари шайхи, юқори санадли муқриъ, тажвид дарслари бор.',use:'Қоидаларни тушунтириш (видео дарслар)'},
{id:'suwaid',n:'Аймон Рушдий Сувайд',c:'Сурия',f:'Ayman_Sowaid_64kbps',q:'التجويد المصور أيمن سويد',sp:'секин',why:'Тажвид муаллими, махражларни кўрсатиб тушунтирадиган видео дарслари машҳур.',use:'Махраж: ع ح ص ض ط ظ ق غ'},
{id:'akhdar',n:'Иброҳим ал-Ахдар',c:'Мадина',f:'Ibrahim_Akhdar_32kbps',sp:'секин',why:'Секин, ҳар ҳарфи аниқ муратталь.',use:'Эргашиб ўқиш'},
{id:'ayyub',n:'Муҳаммад Айюб',c:'Мадина',f:'Muhammad_Ayyoub_128kbps',sp:'ўртача',why:'Текис, ўлчовли муратталь.',use:'Ҳифз ва равон ўқиш'},
{id:'hudhaify',n:'Али ал-Ҳузайфий',c:'Мадина',f:'Hudhaify_128kbps',sp:'секин',why:'Секин ва тиниқ.',use:'Ҳифз, вақф жойлари'},
{id:'basfar',n:'Абдуллоҳ Басфар',c:'Саудия',f:'Abdullah_Basfar_192kbps',sp:'ўртача',why:'Текис, равшан муратталь.',use:'Ҳифз ва равон ўқиш'},
{id:'afasy',n:'Мишорий Рошид ал-Афосий',c:'Кувайт',f:'Alafasy_128kbps',sp:'ўртача',why:'Тиниқ, оммабоп; quran.com да сўзма-сўз аудиоси бор.',use:'Сўзма-сўз ўқиш, ҳифз'},
{id:'ghamidi',n:'Саъд ал-Ғомидий',c:'Саудия',f:'Ghamadi_40kbps',sp:'ўртача',why:'Тиниқ, оммабоп.',use:'Ҳифз, такрор'},
{id:'muaiqly',n:'Маҳир ал-Муайқлий',c:'Макка',f:'MaherAlMuaiqly128kbps',sp:'ўртача',why:'Ҳарам имоми, равшан ўқиш.',use:'Ҳифз, намоздаги ўқиш намунаси'},
{id:'sudais',n:'Абдурраҳмон ас-Судайс',c:'Макка',f:'Abdurrahmaan_As-Sudais_192kbps',sp:'тез',why:'Ҳарам имоми, ҳадр ўқиш.',use:'Ҳифзни мустаҳкамлаш, тинглаш'},
{id:'shuraym',n:'Суъуд аш-Шурайм',c:'Макка',f:'Saood_ash-Shuraym_128kbps',sp:'тез',why:'Ҳарам имоми, ҳадр, тиниқ.',use:'Ёдланганни такрорлаш'},
{id:'basit',n:'Абдулбосит Абдуссомад',c:'Миср',f:'Abdul_Basit_Mujawwad_128kbps',sp:'мужаввад',why:'Мужаввад, узун нафас.',use:'Тинглаш ва руҳ учун'},
{id:'ismail',n:'Мустафо Исмоил',c:'Миср',f:'Mustafa_Ismail_48kbps',sp:'мужаввад',why:'Мужаввад устаси; бу тўпламда баъзи оятлар йўқ.',use:'Илғор босқичда тинглаш'},
{id:'dosari',n:'Ёсир ад-Давсарий',c:'Макка',f:'Yasser_Ad-Dussary_128kbps',sp:'ўртача',why:'Ҳарам имоми, таъсирли ўқиш.',use:'Тинглаш ва руҳ учун'}];
const rec=()=>R.find(r=>r.id===store.get('rec','husary-m'))||R[0];
const audioURL=(r,s,a)=>{const x=r.f?r:R[0];return `https://everyayah.com/data/${x.f}/${pad(s)}${pad(a)}.mp3`};
const listen=(s,a,chk)=>{const r=rec();const x=r.f?r:R[0];return `<button class="btn p" data-play="${s}:${a}">▶ ${esc(x.n.split(' (')[0])}</button>${chk?`<button class="btn" data-recref="${s}:${a}">🎙 Ўқиб текшириш</button>`:''}<a class="btn" href="https://quran.com/${s}/${a}" target="_blank" rel="noopener">quran.com</a>`};

const L=[

function analyze(buf){
 const ch=buf.numberOfChannels,n0=buf.length,sr0=buf.sampleRate,fac=Math.max(1,Math.round(sr0/11025)),sr=sr0/fac,N=Math.floor(n0/fac),x=new Float32Array(N);
 const chans=[];for(let c=0;c<ch;c++)chans.push(buf.getChannelData(c));
 for(let i=0;i<N;i++){let s=0;for(let c=0;c<ch;c++)for(let j=0;j<fac;j++)s+=chans[c][i*fac+j]||0;x[i]=s/(ch*fac)}
 const hop=Math.round(sr*0.01),win=Math.round(sr*0.03),F=Math.max(0,Math.floor((N-win)/hop)),db=new Float32Array(F),vo=new Uint8Array(F);
 for(let f=0;f<F;f++){let e=0;const o=f*hop;for(let i=0;i<win;i++)e+=x[o+i]*x[o+i];db[f]=10*Math.log10(e/win+1e-12)}
 const srt=Array.from(db).sort((a,b)=>a-b),top=srt[Math.floor(F*0.95)]||0,lo=Math.round(sr/400),hi=Math.round(sr/70);
 for(let f=0;f<F;f++){if(db[f]<top-30)continue;const o=f*hop;let e0=0;for(let i=0;i<win;i++)e0+=x[o+i]*x[o+i];let best=0;
  for(let L2=lo;L2<=hi;L2++){let s=0,e1=0;for(let i=0;i<win-L2;i++){s+=x[o+i]*x[o+i+L2];e1+=x[o+i+L2]*x[o+i+L2]}const r=s/Math.sqrt(e0*e1+1e-12);if(r>best)best=r}
  vo[f]=best>0.5?1:0}
 const sm=new Float32Array(F);for(let f=0;f<F;f++){let s=0,k=0;for(let j=-2;j<=2;j++)if(db[f+j]!==undefined){s+=db[f+j];k++}sm[f]=s/k}
 const sil=f=>sm[f]<top-28&&!vo[f];let first=0,last=F-1;while(first<F&&sil(first))first++;while(last>0&&sil(last))last--;
 const pauses=[];for(let f=first;f<=last;){if(sil(f)){let g=f;while(g<=last&&sil(g))g++;if(g-f>=25)pauses.push([f,g]);f=g}else f++}
 const nuc=[];let f=first;while(f<=last){if(vo[f]&&sm[f]>top-22&&(f===0||sm[f]>=sm[f-1])&&sm[f]>=(sm[f+1]??-1e9)){const p=sm[f];let a=f,b=f;while(a>first&&vo[a-1]&&sm[a-1]>p-4)a--;while(b<last&&vo[b+1]&&sm[b+1]>p-4)b++;const pr=nuc[nuc.length-1];if(pr&&a<=pr[1]){pr[1]=Math.max(pr[1],b)}else nuc.push([a,b]);f=b+1}else f++}
 const durs=nuc.map(([a,b])=>((b-a+1)*10+10)).filter(d=>d>=40),ds=[...durs].sort((a,b)=>a-b),unit=Math.max(70,ds[Math.floor(ds.length*0.3)]||120);
 const speak=(last-first+1)*10/1000-pauses.reduce((s,[a,b])=>s+(b-a)*10/1000,0);
 const long=nuc.map(([a,b])=>({t:a/100,d:((b-a+1)*10+10)})).filter(o=>o.d>=1.7*unit).map(o=>({...o,h:Math.round(o.d/unit*2)/2}));
 return {db:sm,vo,top,F,first,last,pauses,nuc,unit,long,dur:n0/sr0,rate:durs.length/Math.max(speak,0.1),speak}}

function plot(cv,A){const W=cv.clientWidth,H=cv.clientHeight,d=window.devicePixelRatio||1;cv.width=W*d;cv.height=H*d;const g=cv.getContext('2d');g.scale(d,d);const cs=getComputedStyle(document.documentElement);
 const c=v=>cs.getPropertyValue(v).trim()||'#888';g.clearRect(0,0,W,H);const X=f=>f/A.F*W,Y=v=>H-8-Math.max(0,(v-(A.top-40))/45)*(H-16);
 g.fillStyle=c('--line');A.pauses.forEach(([a,b])=>g.fillRect(X(a),0,X(b)-X(a),H));

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
const gotQ=d=>{Q=d;render()};
const viaScript=()=>new Promise((ok,no)=>{if(window.QURAN_DATA)return ok(window.QURAN_DATA);const sc=document.createElement('script');sc.src='quran.js';sc.onload=()=>window.QURAN_DATA?ok(window.QURAN_DATA):no();sc.onerror=no;document.head.appendChild(sc)});
const CDNQ='https://cdn.jsdelivr.net/npm/quran-json@3.1.2/dist/quran.json';
const viaCDN=()=>fetch(CDNQ).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>d.map(x=>({n:x.id,ar:x.name,tr:x.transliteration,v:x.verses.map(v=>v.text)})));
const viaLocal=()=>fetch('quran.json').then(r=>{if(!r.ok)throw 0;return r.json()});
(location.protocol==='file:'?viaScript():viaCDN().catch(viaLocal).catch(viaScript)).then(gotQ).catch(()=>{$('#view').insertAdjacentHTML('afterbegin','<div class="note">Қуръон матни юкланмади. Саҳифани янгиланг.</div>')});
}
</script>
</body>
</html>
